name = "domk-admin-api"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# Authenticated, low-QPS. Cloudflare Access sits in front of this hostname
# with two policies: one for human identity, one for service tokens.
routes = [
  { pattern = "links.domk.pro/api/*", zone_name = "domk.pro" }
]

[observability]
enabled = true

[vars]
# Zero Trust team domain — "acme", "acme.cloudflareaccess.com" and the full
# https:// URL are all accepted.
ACCESS_TEAM_DOMAIN = "domkirbycreative"
# AUD tag of the links.domk.pro Access application.
ACCESS_AUD = "2f738987cafb86420f5796afff2f78c5f43a4a6bacb46f6fea8edf9964a23521"
SHORT_DOMAIN = "domk.pro"
CF_ACCOUNT_ID = "0e758d1a495ad42f4476932698a6abfb"
ANALYTICS_DATASET = "domkpro_clicks"
KV_TTL_SECONDS = "86400"

# Secrets (never in this file):
#   wrangler secret put CF_ANALYTICS_API_TOKEN   # needs Account Analytics:Read

[[d1_databases]]
binding = "DB"
database_name = "domk-links"
database_id = "7443e9ed-1854-4f42-b1b0-682c14e87026"
migrations_dir = "../../packages/db-schema/migrations"

# Same namespace the redirect worker reads. Every mutation writes through here.
[[kv_namespaces]]
binding = "LINKS"
id = "6c242f3b1504475b8b88a03caa8473a4"
