name = "domk-interactive-link"
main = "src/index.ts"
compatibility_date = "2025-01-15"
workers_dev = false

# Owns the _i_ namespace, reserved (see admin-api's RESERVED_SLUGS) for
# interactive features that need a page in between the short link and the
# destination — password protection today, maybe more later.
routes = [
  { pattern = "domk.pro/_i_/*", zone_name = "domk.pro" }
]

[observability]
enabled = true

# Never calls admin-api (it can't get past Access anyway) — reads links and
# themes directly. No KV binding: this worker isn't part of the redirect hot
# path, so there's nothing here worth caching.
[[d1_databases]]
binding = "DB"
database_name = "domk-links"
database_id = "7443e9ed-1854-4f42-b1b0-682c14e87026"
# No migrations_dir — only admin-api owns migrations.
