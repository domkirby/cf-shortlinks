name = "domk-redirect"
main = "src/index.ts"
compatibility_date = "2025-01-15"
workers_dev = false

# Public hot path. Deployed separately from admin-api so admin changes can
# never grow this bundle or take the redirect path down with them.
routes = [
  { pattern = "domk.pro/*", zone_name = "domk.pro" }
]

[observability]
enabled = true

[vars]
# Unset (or empty) keeps the plain-404 behaviour for unknown slugs.
DEFAULT_REDIRECT_URL = "https://domkirby.com"
KV_TTL_SECONDS = "86400"
REDIRECT_STATUS = "302"
SHORT_DOMAIN = "domk.pro"

# Cache of the links table. Same namespace the admin API writes through to.
# Replace the id after: wrangler kv namespace create LINKS
[[kv_namespaces]]
binding = "LINKS"
id = "6c242f3b1504475b8b88a03caa8473a4"

# Source of truth. Read only on a KV miss.
# Replace the id after: wrangler d1 create domk-links
[[d1_databases]]
binding = "DB"
database_name = "domk-links"
database_id = "7443e9ed-1854-4f42-b1b0-682c14e87026"

[[analytics_engine_datasets]]
binding = "domkpro_clicks"
dataset = "domkpro_clicks"
