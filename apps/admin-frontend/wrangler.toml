# Cloudflare Pages project for the admin SPA.
#
# Deployed with: pnpm --filter @domk/admin-frontend deploy
#
# Access-gate this Pages project as well as the API. There's nothing sensitive
# in the bundle, but static assets for an admin console have no business being
# publicly crawlable, and it keeps the trust boundary in one place: everything
# on links.domk.pro is behind Access.
name = "domk-admin"
pages_build_output_dir = "dist"
compatibility_date = "2025-01-15"
