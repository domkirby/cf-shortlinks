name: Feature request
description: Suggest an idea or improvement for CF Shortlinks.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that the current app doesn't support well?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches or workarounds you've thought about.
    validations:
      required: false

  - type: dropdown
    id: app
    attributes:
      label: Which app(s) would this touch?
      multiple: true
      options:
        - redirect-worker
        - admin-api
        - admin-frontend
        - interactive-link
        - packages/* (shared-types, db-schema, access-verify)
        - CI / deploy pipeline
        - Not sure
    validations:
      required: false

  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd be willing to open a PR for this.
          required: false
