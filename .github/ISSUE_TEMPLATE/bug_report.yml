name: Bug report
description: Something in CF Shortlinks isn't working as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. If this is a **security vulnerability**,
        please don't file it here — use [private reporting](https://github.com/domkirby/cf-shortlinks/security/advisories/new) instead.

  - type: dropdown
    id: app
    attributes:
      label: Which app is affected?
      options:
        - redirect-worker
        - admin-api
        - admin-frontend
        - interactive-link
        - packages/* (shared-types, db-schema, access-verify)
        - CI / deploy pipeline (render-wrangler, workflows)
        - Not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior, as specific as you can make them.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: fresh-fork
    attributes:
      label: Reproducible on a fresh fork?
      description: Have you confirmed this isn't specific to your own deployment's configuration (custom domain, Access policy, modified code)?
      placeholder: "Yes / No / Haven't tried"
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node version, wrangler version, and whether this is local dev (`wrangler dev`) or a deployed fork.
      placeholder: "e.g. Node 22, wrangler 4.x, deployed via GitHub Actions"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Worker logs (`wrangler tail`), browser console output, or CI output. Please redact any Access tokens, API tokens, or your real domain if you'd rather not share them.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: no-sensitive-data
    attributes:
      label: Confirmation
      options:
        - label: I have not pasted any secrets, tokens, or credentials into this issue.
          required: true
